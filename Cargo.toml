[workspace]
members = ["novumchat-core", "novumchat-backend", "novumchat-frontend"]
# The frontend only targets wasm32 (built by Trunk); plain `cargo build`/`cargo test`
# at the workspace root covers the native crates.
default-members = ["novumchat-core", "novumchat-backend"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["James David Clarke <james@jamesdavidclarke.com>"]
repository = "https://github.com/JamesClarke7283/NovumChat"

[workspace.dependencies]
novumchat-core = { path = "novumchat-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
# Keep debug builds lean: full debug info for every dependency costs gigabytes.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Key derivation and crypto are painfully slow without optimisation, even in dev.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 4
lto = "thin"
strip = true

# wasm-bindgen reads the `target_features` custom section; keep it in the UI build.
[profile.release.package.novumchat-frontend]
strip = "debuginfo"
opt-level = "z"
