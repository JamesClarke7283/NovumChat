[build]
target = "./novumchat-frontend/index.html"
dist = "./novumchat-frontend/dist"

[watch]
ignore = ["./novumchat-backend", "./novumchat-frontend/public/css", "./novumchat-frontend/public/vendor", "./target"]

[serve]
addresses = ["127.0.0.1"]
port = 1420
open = false

# Vendors KaTeX / highlight.js / DOMPurify / Mermaid / fonts and compiles Tailwind.
[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["scripts/prebuild.mjs"]
